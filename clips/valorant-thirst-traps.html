<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Valorant Thirst Trap Edits</title>
  <style>
    :root{--bg:#09090b;--panel:#121216;--line:#292932;--text:#f4f2f7;--muted:#9d98a8;--pink:#ff4f87;--violet:#8a70ff}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% -20%,#25142c 0,transparent 38%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    main{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:42px 0 64px}
    header{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}
    .eyebrow{color:var(--pink);font-size:.72rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin:0 0 10px}
    h1{font-size:clamp(2rem,5vw,4.5rem);line-height:.94;letter-spacing:-.055em;margin:0;max-width:780px}
    .meta{color:var(--muted);font-size:.82rem;white-space:nowrap}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
    article{background:linear-gradient(180deg,#17151c,#101014);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 28px 70px #0008}
    .frame{background:#050506;aspect-ratio:9/16;max-height:76vh;display:flex;justify-content:center;margin:auto}
    video{width:100%;height:100%;object-fit:contain;background:#050506}
    .info{padding:18px 20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    h2{font-size:1rem;margin:0 0 5px;letter-spacing:.02em}
    p{color:var(--muted);font-size:.78rem;margin:0}
    a{color:var(--text);text-decoration:none;border:1px solid #403a4b;border-radius:9px;padding:10px 13px;font-size:.75rem;font-weight:700;white-space:nowrap}
    a:hover{border-color:var(--pink);color:#fff}
    footer{color:#696571;font-size:.72rem;margin-top:24px;text-align:center}
    @media(max-width:760px){main{padding-top:24px}header{display:block}.meta{margin-top:14px}.grid{grid-template-columns:1fr;gap:20px}.frame{max-height:none}h1{font-size:2.5rem}}
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">Private Review Page</p>
      <h1>Valorant Thirst Trap Edits</h1>
    </div>
    <div class="meta">2 EDITS · 17.67 SEC · 1080 × 1920</div>
  </header>
  <section class="grid" aria-label="Valorant video edits">
    <article>
      <div class="frame"><video controls playsinline preload="metadata" src="valorant-thirst-trap-1.mp4"></video></div>
      <div class="info"><div><h2>EDIT 01</h2><p>VAL Agent launch cut</p></div><a href="valorant-thirst-trap-1.mp4">OPEN VIDEO</a></div>
    </article>
    <article>
      <div class="frame"><video controls playsinline preload="metadata" src="valorant-thirst-trap-2.mp4"></video></div>
      <div class="info"><div><h2>EDIT 02</h2><p>VA Iris cut</p></div><a href="valorant-thirst-trap-2.mp4">OPEN VIDEO</a></div>
    </article>
  </section>
  <footer>REBOOKED REVIEW HOST</footer>
</main>
</body>
</html>
